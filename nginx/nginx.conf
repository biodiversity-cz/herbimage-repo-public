# Rootless nginx configuration.
#
# Differences from the stock config:
# - no `user` directive and no :80 listener (we run as uid 101),
# - all temp paths live under /tmp (writable via an emptyDir in Kubernetes),
# - server blocks are rendered into /etc/nginx/conf.d by the image's envsubst
#   entrypoint from /etc/nginx/templates/*.conf.template. The Dockerfile
#   chowns the output directory so this also works for the nginx user.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    include /etc/nginx/conf.d/*.conf;
}
